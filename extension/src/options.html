<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atelier Capture — Options</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 20px; max-width: 460px; }
      h1 { font-size: 15px; }
      label { display: block; margin: 12px 0 4px; color: #444; }
      input { width: 100%; padding: 6px 8px; font-family: ui-monospace, monospace; box-sizing: border-box; }
      button { margin-top: 12px; padding: 6px 14px; }
      .hint { color: #666; margin-top: 8px; line-height: 1.4; }
      .status { margin-top: 10px; color: #2e8b57; height: 1em; }
    </style>
  </head>
  <body>
    <h1>Atelier Capture</h1>
    <p class="hint">
      Paste the token shown in the ref-atelier app (toolbar → Browser Capture).
      Captures POST to <code>http://127.0.0.1:47321</code>.
    </p>
    <label for="token">Extension token</label>
    <input id="token" type="text" autocomplete="off" spellcheck="false" placeholder="paste token…" />
    <button id="save">Save</button>
    <div id="status" class="status"></div>
    <script src="options.js"></script>
  </body>
</html>
