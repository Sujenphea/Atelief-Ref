<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atelier — Start sweep</title>
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; margin: 16px; width: 300px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      .target { color: #222; font-weight: 600; margin: 6px 0; min-height: 1.2em; }
      .reason { color: #8a5a00; line-height: 1.4; margin: 6px 0; }
      label.opt { display: flex; align-items: center; gap: 6px; color: #444; margin: 10px 0; }
      label.opt input { width: auto; }
      button { padding: 6px 14px; margin-top: 6px; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { margin-top: 10px; color: #2e8b57; line-height: 1.4; min-height: 1.2em; }
      .hint { color: #777; margin-top: 12px; line-height: 1.4; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Atelier — Start sweep</h1>
    <div id="target" class="target">Checking this tab…</div>
    <div id="reason" class="reason" hidden></div>
    <label class="opt" id="videoRow" hidden>
      <input id="resolveVideo" type="checkbox" />
      Download full video (not just the poster)
    </label>
    <button id="start" disabled>Start sweep</button>
    <div id="status" class="status"></div>
    <p class="hint">
      Progress shows in the ref-atelier app's <strong>Sweeps</strong> tab. The sweep
      keeps running after you close this popup.
    </p>
    <p class="hint">
      Platform APIs drift ~every 2 weeks. From <code>extension/</code> run
      <code>npm run drift-check</code> (exits non-zero when fixtures are stale).
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
