<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atelier — Start sweep</title>
    <!-- The app's tokens. Everything this page needs is in there; only the
         popup's own width and the one type role for the target line are local. -->
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { width: 300px; }
      .target {
        margin: var(--space-sm) 0;
        min-height: 1.2em;
        font: var(--text-body-emphasis);
        color: var(--ink-primary);
      }
    </style>
  </head>
  <body>
    <h1>Atelier — Start sweep</h1>
    <div id="target" class="target">Checking this tab…</div>
    <div id="reason" class="reason" hidden></div>
    <div id="warn" class="warn" hidden></div>
    <label class="opt ack" id="ackRow" hidden>
      <input id="acknowledge" type="checkbox" />
      I understand the account risk and want to sweep anyway
    </label>
    <label class="opt" id="expandRow" hidden>
      <input id="expandNotes" type="checkbox" />
      <span id="expandLabel"></span>
    </label>
    <div id="expandDetail" class="hint" hidden></div>
    <label class="opt" id="videoRow" hidden>
      <input id="resolveVideo" type="checkbox" />
      Download full video (not just the poster)
    </label>
    <button id="start" disabled>Start sweep</button>
    <div id="status" class="status"></div>
    <p class="hint">
      Progress shows in the ref-atelier app's <strong>Sweeps</strong> tab. The sweep
      keeps running after you close this popup.
    </p>
    <p class="hint">
      Platform APIs drift ~every 2 weeks. From <code>extension/</code> run
      <code>npm run drift-check</code> (exits non-zero when fixtures are stale).
    </p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
